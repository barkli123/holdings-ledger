<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DT.Stocks</title>
<meta name="description" content="כלי אישי למעקב אחרי החזקות מסחר — חברה, מחיר כניסה, כמות ורווח/הפסד.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DT.Stocks">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
  :root{
    --bg:#FAF9F6;
    --surface:#FFFFFF;
    --surface-2:#F3F1EC;
    --ink:#15151A;
    --ink-dim:#83807A;
    --border:#EAE7DF;
    --accent:#1E3A5F;
    --accent-strong:#14263F;
    --accent-soft:#EBF0F6;
    --pos:#1F7A4D;
    --pos-soft:#E6F3EC;
    --neg:#B3261E;
    --neg-soft:#FBEAE8;
    --shadow: 0 1px 2px rgba(20,20,26,.03), 0 24px 48px rgba(20,20,26,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B0B0D;
      --surface:#17171B;
      --surface-2:#1F1F24;
      --ink:#F2F1EC;
      --ink-dim:#9B9994;
      --border:#2A2A30;
      --accent:#5B84C4;
      --accent-strong:#7A9CD4;
      --accent-soft:#182338;
      --pos:#3FAE74;
      --pos-soft:#11291C;
      --neg:#E5584C;
      --neg-soft:#301613;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 28px 56px rgba(0,0,0,.6);
    }
  }

  *{ box-sizing:border-box; }
  html, body{ margin:0; }
  [hidden]{ display:none !important; }
  body{
    direction:rtl;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:"Fraunces",Georgia,serif; }

  /* ---------- Welcome screen ---------- */
  .welcome{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--bg);
  }
  .welcome-blob{
    position:absolute;
    width:60vmax;
    height:60vmax;
    border-radius:50%;
    filter:blur(70px);
    opacity:.28;
    pointer-events:none;
  }
  .blob-a{
    background:radial-gradient(circle at 30% 30%, #4A6FA5, transparent 70%);
    top:-20%;
    right:-15%;
  }
  .blob-b{
    background:radial-gradient(circle at 70% 70%, #C9A66B, transparent 70%);
    bottom:-25%;
    left:-15%;
  }
  @media (prefers-reduced-motion: no-preference){
    .blob-a{ animation: drift-a 22s ease-in-out infinite; }
    .blob-b{ animation: drift-b 26s ease-in-out infinite; }
  }
  @keyframes drift-a{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-4%, 5%); }
  }
  @keyframes drift-b{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(4%, -5%); }
  }
  .welcome-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    text-align:center;
    padding:24px;
  }
  .welcome-eyebrow{
    margin:0;
    direction:ltr;
    font-size:15px;
    font-weight:600;
    letter-spacing:.08em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .welcome-title{
    margin:0;
    direction:ltr;
    font-size:clamp(46px,9vw,84px);
    font-weight:200;
    letter-spacing:-0.02em;
    text-wrap:balance;
  }
  @media (prefers-reduced-motion: no-preference){
    .welcome-content{ animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .btn-continue{
    direction:ltr;
    background:var(--accent);
    color:#fff;
    border:0;
    border-radius:999px;
    padding:15px 42px;
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(30,58,95,.35);
    transition:transform .15s ease, background .15s ease;
  }
  .btn-continue:hover{ background:var(--accent-strong); transform:translateY(-1px); }
  .btn-continue:active{ transform:translateY(0) scale(.98); }

  /* ---------- Main app ---------- */
  .app{
    max-width:900px;
    margin:0 auto;
    padding:0;
    min-height:100vh;
  }

  .masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:28px 28px 0;
    flex-wrap:wrap;
  }
  .masthead .brand{
    font-weight:600;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--ink-dim);
  }
  .currency-toggle{
    display:flex;
    background:var(--surface-2);
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .currency-toggle button{
    border:0;
    background:transparent;
    color:var(--ink-dim);
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    padding:7px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .currency-toggle button.active{
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }

  /* hero portfolio value */
  .hero{
    padding:32px 28px 36px;
    text-align:center;
  }
  .hero-label{
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:.03em;
    margin-bottom:10px;
  }
  .hero-value{
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:clamp(40px,8vw,60px);
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    direction:ltr;
    unicode-bidi:isolate;
  }
  .hero-sub{
    margin-top:10px;
    font-size:15px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    direction:ltr;
    unicode-bidi:isolate;
  }
  .hero-sub.pos{ color:var(--pos); }
  .hero-sub.neg{ color:var(--neg); }

  .summary-secondary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--border);
    border-radius:16px;
    overflow:hidden;
    margin:0 28px 28px;
    box-shadow:var(--shadow);
  }
  .stat-mini{
    background:var(--surface);
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .stat-mini .label{
    font-size:12px;
    color:var(--ink-dim);
  }
  .stat-mini .value{
    font-variant-numeric:tabular-nums;
    font-size:18px;
    font-weight:600;
    letter-spacing:-.01em;
  }

  .section{
    padding:0 28px;
    margin-bottom:28px;
  }
  .section-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  .card{
    background:var(--surface);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  form.add-form{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 1fr auto;
    gap:20px;
    padding:24px;
    align-items:end;
  }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{
    font-size:12px;
    color:var(--ink-dim);
  }
  .field input{
    background:transparent;
    border:0;
    border-bottom:1px solid var(--border);
    border-radius:0;
    padding:6px 2px 8px;
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
    transition:border-color .15s ease;
  }
  .field input[type="number"]{
    font-variant-numeric:tabular-nums;
  }
  .field input:focus, button:focus-visible{
    outline:none;
    border-color:var(--accent);
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border:0;
    border-radius:10px;
    padding:12px 22px;
    font-family:inherit;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .btn-primary:hover{ background:var(--accent-strong); }

  .table-wrap{ overflow-x:auto; }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:680px;
  }
  thead th{
    text-align:right;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
    padding:0 24px 12px;
  }
  thead tr{ display:table-row; }
  thead th:first-child{ padding-top:22px; }
  thead th.num, td.num{ text-align:left; }
  tbody td{
    padding:18px 24px;
    border-top:1px solid var(--border);
    font-size:15px;
  }
  tbody tr:hover{ background:var(--surface-2); }
  tbody tr:last-child td{ padding-bottom:22px; }
  td.num, td.mono{
    font-variant-numeric:tabular-nums;
  }
  td.company{ font-weight:600; }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .pill.pos{ background:var(--pos-soft); color:var(--pos); }
  .pill.neg{ background:var(--neg-soft); color:var(--neg); }
  .row-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .icon-btn{
    background:var(--surface-2);
    border:0;
    border-radius:50%;
    color:var(--ink-dim);
    width:28px;
    height:28px;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn.danger:hover{ background:var(--neg-soft); color:var(--neg); }

  .price-edit{
    display:flex;
    gap:4px;
    align-items:center;
  }
  .price-edit input{
    width:76px;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--border);
    border-radius:0;
    padding:4px 2px;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
    text-align:left;
  }
  .price-edit input:focus{
    outline:none;
    border-color:var(--accent);
  }

  .empty{
    padding:56px 24px;
    text-align:center;
    color:var(--ink-dim);
    font-size:15px;
  }

  footer.hint{
    padding:0 28px 40px;
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
  }

  @media (max-width:640px){
    .masthead, .hero, .section, footer.hint{ padding-left:20px; padding-right:20px; }
    .summary-secondary{ grid-template-columns:1fr; margin-left:20px; margin-right:20px; }
    form.add-form{ grid-template-columns:1fr 1fr; padding:20px; }
    form.add-form .btn-primary{ grid-column:1 / -1; }

    table{ min-width:0; }
    thead{ display:none; }
    tbody tr{
      display:flex;
      flex-direction:column;
      padding:18px 20px;
      border-top:1px solid var(--border);
    }
    tbody tr:first-child{ border-top:0; }
    tbody tr:last-child{ padding-bottom:18px; }
    tbody td{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:5px 0;
      border-top:0;
      font-size:14px;
    }
    td.company{
      font-size:17px;
      padding:0 0 10px;
      justify-content:flex-start;
    }
    td[data-label]::before{
      content:attr(data-label);
      color:var(--ink-dim);
      font-size:13px;
    }
    td.num{ text-align:left; }
    .row-actions{ justify-content:flex-end; padding-top:6px; }
  }

  @media (prefers-reduced-motion: no-preference){
    tbody tr, .currency-toggle button{ transition: background .15s ease, box-shadow .15s ease; }
  }
</style>
</head>
<body>
<div class="welcome" id="welcomeScreen">
  <div class="welcome-blob blob-a"></div>
  <div class="welcome-blob blob-b"></div>
  <div class="welcome-content">
    <p class="welcome-eyebrow">DT.Stocks</p>
    <h1 class="welcome-title">Hello Dvir</h1>
    <button type="button" class="btn-continue" id="continueBtn">Continue</button>
  </div>
</div>

<div class="app" id="mainScreen" hidden>
  <div class="masthead">
    <div class="brand">DT.STOCKS</div>
    <div class="currency-toggle" role="group" aria-label="בחירת מטבע">
      <button type="button" data-cur="₪">₪</button>
      <button type="button" data-cur="$">$</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-label">שווי תיק כולל</div>
    <div class="hero-value" id="statValue">—</div>
    <div class="hero-sub" id="statPnl">—</div>
  </div>

  <div class="summary-secondary">
    <div class="stat-mini">
      <span class="label">עלות כוללת</span>
      <span class="value" id="statCost">—</span>
    </div>
    <div class="stat-mini">
      <span class="label">מספר החזקות</span>
      <span class="value" id="statCount">—</span>
    </div>
  </div>

  <div class="section">
    <p class="section-title">הוספת החזקה</p>
    <div class="card">
      <form class="add-form" id="addForm">
        <div class="field">
          <label for="fCompany">שם חברה</label>
          <input id="fCompany" type="text" placeholder="לדוגמה: טבע" required>
        </div>
        <div class="field">
          <label for="fEntry">מחיר כניסה</label>
          <input id="fEntry" type="number" step="0.01" min="0" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="fQty">כמות מוחזקת</label>
          <input id="fQty" type="number" step="0.0001" min="0" placeholder="0" required>
        </div>
        <div class="field">
          <label for="fCurrent">מחיר נוכחי (רשות)</label>
          <input id="fCurrent" type="number" step="0.01" min="0" placeholder="כמו מחיר כניסה">
        </div>
        <button type="submit" class="btn-primary">הוסף</button>
      </form>
    </div>
  </div>

  <div class="section">
    <p class="section-title">ההחזקות שלי</p>
    <div class="card">
      <div class="table-wrap">
        <table id="holdingsTable">
          <thead>
            <tr>
              <th>חברה</th>
              <th class="num">מחיר כניסה</th>
              <th class="num">כמות</th>
              <th class="num">מחיר נוכחי</th>
              <th class="num">שווי שוק</th>
              <th class="num">רווח / הפסד</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>עדיין לא הוספת החזקות. מלא/י את הטופס למעלה כדי להתחיל.</div>
    </div>
  </div>

  <footer class="hint">כלי דמו אישי — הנתונים נשמרים רק במכשיר הזה ואינם נשלחים לשום מקום.</footer>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "holdings-ledger.positions";
  var CUR_KEY = "holdings-ledger.currency";

  var state = {
    positions: [],
    currency: "₪"
  };

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      state.positions = raw ? JSON.parse(raw) : [];
    }catch(e){ state.positions = []; }
    try{
      var cur = localStorage.getItem(CUR_KEY);
      if(cur === "₪" || cur === "$") state.currency = cur;
    }catch(e){}
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.positions)); }catch(e){}
  }
  function saveCurrency(){
    try{ localStorage.setItem(CUR_KEY, state.currency); }catch(e){}
  }

  function fmt(num){
    var n = Number(num) || 0;
    return state.currency + n.toLocaleString("he-IL", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtQty(num){
    var n = Number(num) || 0;
    return n.toLocaleString("he-IL", {maximumFractionDigits:4});
  }
  function fmtPct(num){
    var n = Number(num) || 0;
    var sign = n > 0 ? "+" : "";
    return sign + n.toLocaleString("he-IL", {minimumFractionDigits:1, maximumFractionDigits:1}) + "%";
  }

  function uid(){
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  function render(){
    var tbody = document.getElementById("tbody");
    var empty = document.getElementById("emptyState");
    tbody.innerHTML = "";

    if(state.positions.length === 0){
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }

    var totalCost = 0, totalValue = 0;

    state.positions.forEach(function(p){
      var current = (p.current === null || p.current === undefined || p.current === "") ? p.entry : p.current;
      var cost = p.entry * p.qty;
      var value = current * p.qty;
      var pnl = value - cost;
      var pnlPct = cost > 0 ? (pnl / cost) * 100 : 0;
      totalCost += cost;
      totalValue += value;

      var tr = document.createElement("tr");

      var tdCompany = document.createElement("td");
      tdCompany.className = "company";
      tdCompany.textContent = p.company;
      tr.appendChild(tdCompany);

      var tdEntry = document.createElement("td");
      tdEntry.className = "num mono";
      tdEntry.setAttribute("data-label", "מחיר כניסה");
      tdEntry.textContent = fmt(p.entry);
      tr.appendChild(tdEntry);

      var tdQty = document.createElement("td");
      tdQty.className = "num mono";
      tdQty.setAttribute("data-label", "כמות");
      tdQty.textContent = fmtQty(p.qty);
      tr.appendChild(tdQty);

      var tdCurrent = document.createElement("td");
      tdCurrent.className = "num mono";
      tdCurrent.setAttribute("data-label", "מחיר נוכחי");
      var priceWrap = document.createElement("div");
      priceWrap.className = "price-edit";
      priceWrap.style.justifyContent = "flex-end";
      var priceInput = document.createElement("input");
      priceInput.type = "number";
      priceInput.step = "0.01";
      priceInput.min = "0";
      priceInput.value = current;
      priceInput.setAttribute("aria-label", "עדכון מחיר נוכחי עבור " + p.company);
      priceInput.addEventListener("change", function(){
        var v = parseFloat(priceInput.value);
        p.current = isNaN(v) ? null : v;
        save();
        render();
      });
      priceWrap.appendChild(priceInput);
      tdCurrent.appendChild(priceWrap);
      tr.appendChild(tdCurrent);

      var tdValue = document.createElement("td");
      tdValue.className = "num mono";
      tdValue.setAttribute("data-label", "שווי שוק");
      tdValue.textContent = fmt(value);
      tr.appendChild(tdValue);

      var tdPnl = document.createElement("td");
      tdPnl.className = "num";
      tdPnl.setAttribute("data-label", "רווח / הפסד");
      var pill = document.createElement("span");
      pill.className = "pill " + (pnl >= 0 ? "pos" : "neg");
      pill.textContent = fmt(pnl) + " (" + fmtPct(pnlPct) + ")";
      tdPnl.appendChild(pill);
      tr.appendChild(tdPnl);

      var tdActions = document.createElement("td");
      var actions = document.createElement("div");
      actions.className = "row-actions";
      var delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "icon-btn danger";
      delBtn.textContent = "✕";
      delBtn.setAttribute("aria-label", "מחיקת " + p.company);
      delBtn.addEventListener("click", function(){
        state.positions = state.positions.filter(function(x){ return x.id !== p.id; });
        save();
        render();
      });
      actions.appendChild(delBtn);
      tdActions.appendChild(actions);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });

    var totalPnl = totalValue - totalCost;
    document.getElementById("statCost").textContent = fmt(totalCost);
    document.getElementById("statValue").textContent = fmt(totalValue);
    var pnlEl = document.getElementById("statPnl");
    pnlEl.textContent = fmt(totalPnl) + (totalCost > 0 ? " (" + fmtPct((totalPnl/totalCost)*100) + ")" : "");
    pnlEl.className = "hero-sub " + (totalPnl >= 0 ? "pos" : "neg");
    document.getElementById("statCount").textContent = state.positions.length;

    document.querySelectorAll(".currency-toggle button").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.cur === state.currency);
    });
  }

  document.getElementById("addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var company = document.getElementById("fCompany").value.trim();
    var entry = parseFloat(document.getElementById("fEntry").value);
    var qty = parseFloat(document.getElementById("fQty").value);
    var currentRaw = document.getElementById("fCurrent").value;
    var current = currentRaw === "" ? null : parseFloat(currentRaw);

    if(!company || isNaN(entry) || isNaN(qty)) return;

    state.positions.push({
      id: uid(),
      company: company,
      entry: entry,
      qty: qty,
      current: current
    });
    save();
    render();
    e.target.reset();
    document.getElementById("fCompany").focus();
  });

  document.querySelectorAll(".currency-toggle button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.currency = btn.dataset.cur;
      saveCurrency();
      render();
    });
  });

  document.getElementById("continueBtn").addEventListener("click", function(){
    document.getElementById("welcomeScreen").hidden = true;
    document.getElementById("mainScreen").hidden = false;
    window.scrollTo(0, 0);
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }

  load();
  render();
})();
</script>
</body>
</html>
